:root{--navy:#154273;--navy-d:#0e2e52;--paars:#8f1d63;--paars-d:#6e1449;--paars-t:#f7ebf2;--ink:#1b2430;--muted:#5a6573;--line:#d5dfe9;--line2:#e7eef5;--tint:#e8f1fa;--tint2:#f4f8fc;--r:16px;--r-s:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3','RO Sans',Calibri,Arial,sans-serif;color:var(--ink);background:#fff;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--navy);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--paars)}
:focus-visible{outline:3px solid #ffb612;outline-offset:2px;border-radius:6px}
#app:focus{outline:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* kop volgens rijkshuisstijl */
.site-header{background:#fff}
.site-header .wrap{display:flex;justify-content:center}
.logo{position:relative;display:block;width:44px;height:88px;text-decoration:none;color:#000}
.logo img{display:block;width:44px;height:88px}
.logo span{position:absolute;left:56px;top:46px;width:240px;font-size:15.5px;line-height:1.25}
.menubar{background:var(--navy);position:sticky;top:0;z-index:5}
.menubar ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px;padding:8px 0}
.menubar a{display:block;padding:8px 16px;color:#fff;text-decoration:none;font-size:17px;border-radius:999px;transition:background .15s}
.menubar a:hover{background:rgba(255,255,255,.12);color:#fff}
.menubar a[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.crumbs{padding:18px 0 2px;font-size:15px;color:var(--muted)}
.crumbs a{color:var(--navy)}
.crumbs .sep{margin:0 8px;color:#a0aab5}
main.wrap{padding-top:24px;padding-bottom:88px}
.site-footer{background:var(--navy);color:#fff;padding:36px 0 44px;font-size:16px;border-radius:28px 28px 0 0;position:relative}
.site-footer b{display:block;font-size:19px;margin-bottom:2px}
.site-footer b::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:#d77bb0;margin-top:10px;margin-bottom:8px}

/* typografie */
h1{font-size:42px;line-height:1.12;color:var(--navy);font-weight:700;letter-spacing:-.01em}
h2{font-size:28px;line-height:1.2;color:var(--navy);font-weight:700}
h3{font-size:20px;line-height:1.3;color:var(--navy);font-weight:700}
.eyebrow{display:inline-block;font-size:15px;font-weight:600;color:var(--paars);margin-bottom:6px}
.lead{font-size:20px;line-height:1.55;margin-top:12px;max-width:820px}
.muted{color:var(--muted)}
.section{margin-top:48px}
.section>h2{margin-bottom:6px}
.section>p.intro{color:var(--muted);margin-bottom:18px;max-width:820px}
.section>h2+*:not(p){margin-top:18px}

/* voorpagina */
.hero{position:relative;border-radius:24px;overflow:hidden;display:flex;justify-content:center;background:linear-gradient(180deg,#ebf4fd 0,#ebf4fd 42%,#cde6fa 47%,#cde6fa 100%)}
.hero img{display:block;width:min(100%,800px);height:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 4%,#000 96%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 4%,#000 96%,transparent 100%)}
.intro-card{position:relative;margin:-64px 0 0 32px;max-width:640px;background:#fff;border-radius:var(--r);padding:28px 32px 26px;box-shadow:0 10px 30px rgba(21,66,115,.12);border-left:6px solid var(--paars)}
.intro-card .lead{font-size:19px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px}
.tile{position:relative;background:var(--tint);border-radius:var(--r);padding:26px 28px 24px 28px;display:flex;flex-direction:column;transition:background .15s,transform .15s}
.tile:hover{background:#dbe9f6;transform:translateY(-2px)}
.tile h2{font-size:24px;padding-right:56px}
.tile h2 a{text-decoration:none;color:var(--navy)}
.tile h2 a::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.tile .go{position:absolute;right:22px;top:22px;width:40px;height:40px;border-radius:50%;background:var(--paars);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;transition:background .15s}
.tile:hover .go{background:var(--paars-d)}
.tile p{margin-top:8px}
.tile .facts{margin-top:auto;padding-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:14.5px;background:#fff;border-radius:999px;padding:3px 12px;color:var(--ink)}
.pill.p{background:var(--paars-t);color:var(--paars);font-weight:600}
.tile.wide{grid-column:1/-1;background:#fff;border:1px solid var(--line)}
.tile.wide:hover{background:var(--tint2)}
.tile.wide .pill{background:var(--tint)}

/* domeinpagina */
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.meta div{background:var(--tint2);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 14px;font-size:14.5px;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-weight:600;font-size:16px}
details.visie{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.visie summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:17px;list-style:none;padding:14px 20px;display:flex;align-items:center;gap:12px}
details.visie summary:hover{background:var(--tint2)}
details.visie summary::-webkit-details-marker{display:none}
details.visie summary::before{content:"›";display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--paars-t);color:var(--paars);font-weight:700;transition:transform .15s}
details.visie[open] summary::before{transform:rotate(90deg)}
.visie-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:6px 20px 22px}
.visie-grid h3{font-size:18px}
.visie-grid p{margin-top:4px;font-size:16px}
.visie-open{margin-top:36px}
.vcijfers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.vcijfers div{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px 22px}
.vcijfers div:first-child{background:var(--paars)}
.vcijfers b{display:block;font-size:36px;line-height:1.1}
.vcijfers span{font-size:16px;color:#dfe7f0}
.vblokken{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.vblokken.in{margin:4px 0 0;padding:0 18px 18px}
.vblok{position:relative;background:var(--tint2);border-radius:var(--r);padding:22px 24px 22px 70px}
.vblok h3{font-size:19px}
.vblok p{margin-top:6px;font-size:16.5px}
.vnr{position:absolute;left:22px;top:20px;width:32px;height:32px;border-radius:50%;background:var(--paars-t);color:var(--paars);font-weight:700;display:flex;align-items:center;justify-content:center}
.film{margin-bottom:34px}
.film-stage{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer}
.film-stage svg{border-radius:var(--r) var(--r) 0 0;aspect-ratio:16/9}
.film-stage svg{display:block;width:100%;height:100%}
.film-cap{background:#fff;border:1px solid var(--line2);border-top:0;border-radius:0 0 var(--r) var(--r);padding:12px 18px 14px;min-height:84px}
.film-k{font-size:13.5px;font-weight:700;color:var(--paars)}
.film-cap p{font-size:15.5px;line-height:1.4;margin-top:1px}
.film-big{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--paars);color:#fff;font-size:30px;border:0;cursor:pointer;box-shadow:0 8px 24px rgba(143,29,99,.35);display:none;align-items:center;justify-content:center}
.film-big span{margin-left:6px}
.film-stage.poster .film-big,.film-stage.done .film-big{display:flex}
.film-stage.poster .scene{opacity:.45}
.film-stage.done .film-big{left:auto;top:16px;right:16px;bottom:auto;transform:none;width:52px;height:52px;font-size:19px}
.film-stage.done .film-big span{margin-left:0}
.film-ctl{display:flex;align-items:center;gap:12px;margin-top:10px}
.film-pp{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;border:0;cursor:pointer;font-size:14px;flex:none}
.film-pp:hover{background:var(--paars)}
.film-prog{flex:1;display:flex;gap:6px}
.film-prog span{flex:1;height:8px;border-radius:4px;background:var(--tint);cursor:pointer;overflow:hidden}
.film-prog i{display:block;height:100%;width:0;background:var(--paars)}
.film-time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.film .an{opacity:0;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.film .an-up{transform:translateY(26px)}
.film .an-pop{transform:scale(.55)}
.film .an-slide{transform:translateX(-46px)}
.film .an.on{opacity:1;transform:none}
.film .an-draw{opacity:1}
.film .an-draw path,.film .an-draw rect{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease}
.film .an-draw.on path,.film .an-draw.on rect{stroke-dashoffset:0}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(740px)}}
.film .on .flow{animation:flow 3.4s linear infinite}
.film .orbit{offset-path:path("M480,250 C400,140 230,140 230,250 C230,360 400,360 480,250 C560,140 730,140 730,250 C730,360 560,360 480,250 Z");offset-rotate:0deg}
@keyframes orbit{to{offset-distance:100%}}
.film .on .orbit{animation:orbit 4.5s linear infinite}
@media (prefers-reduced-motion:reduce){.film .an{transform:none}.film .on .flow,.film .on .orbit{animation:none}.film .an-draw path,.film .an-draw rect{stroke-dasharray:none}}
.vtabs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:32px;padding:5px;background:var(--tint);border-radius:999px}
.vtabs a{padding:9px 20px;text-decoration:none;font-size:16.5px;border-radius:999px;color:var(--navy);transition:background .15s}
.vtabs a:hover{background:rgba(255,255,255,.7);color:var(--navy)}
.vtabs a[aria-current="page"]{background:var(--navy);color:#fff;font-weight:600}

/* codes */
.code{display:inline-block;min-width:44px;padding:2px 8px;background:var(--tint);color:var(--navy);font-weight:700;font-size:14px;text-align:center;text-decoration:none;flex:none;line-height:1.55;border-radius:8px}
a.code:hover{background:var(--paars);color:#fff}

/* roadmap */
.rm{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 8px}
.rm-grid{display:grid;grid-template-columns:270px repeat(4,minmax(120px,1fr)) minmax(90px,.6fr);min-width:880px;position:relative;padding:0 0 6px}
.qh{font-size:15px;font-weight:600;color:var(--muted);padding:10px 8px}
.rm-cols{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr)) minmax(90px,.6fr);pointer-events:none}
.rm-cols div{border-left:1px dashed var(--line)}
.rm-cols div:last-child{background:var(--tint2);border-radius:0 10px 10px 0;border-left:1px solid var(--line)}
.rm-label{grid-column:1;display:flex;align-items:center;gap:10px;padding:4px 14px 4px 0;font-size:16px;text-decoration:none;color:var(--ink)}
.rm-label:hover span:last-child{text-decoration:underline;color:var(--navy)}
.rm-bar{display:flex;align-items:center;align-self:center;margin:5px 3px;height:32px;padding:3px 14px;background:var(--navy);color:#fff;text-decoration:none;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px;transition:background .15s}
.rm-bar:hover{background:var(--paars);color:#fff}
.rm-bar.ind{background:#c6d8ea;color:var(--navy)}
.rm-bar.ind:hover{background:var(--paars);color:#fff}
.rm-bar.door{border-radius:999px 0 0 999px;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.rm-ms{padding:0 8px 10px;font-size:14px;color:var(--muted);line-height:1.35}
.rm-ms i{display:block;font-style:normal;padding-left:16px;position:relative}
.rm-ms i::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:var(--paars)}
.legend{display:flex;gap:6px 24px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg{display:inline-block;width:28px;height:12px;background:var(--navy);border-radius:999px}
.lg.ind{background:#c6d8ea}
.lg.ms{width:10px;height:10px;background:var(--paars)}

/* lijsten */
.goal{margin-top:32px}
.goal>p{color:var(--muted);margin-top:2px}
.elist{list-style:none;margin-top:14px;display:grid;gap:10px}
.erow{display:grid;grid-template-columns:56px 1fr 190px;gap:16px;padding:18px 20px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,background .15s}
.erow:hover{border-color:var(--paars);background:var(--tint2)}
.erow:hover h4{color:var(--paars)}
.erow>.code{align-self:start}
.erow h4{font-size:18px;color:var(--navy)}
.erow p{margin-top:2px;font-size:16px}
.erow .res{margin-top:6px;font-size:15px;color:var(--muted)}
.erow .when{font-size:15px;text-align:right;color:var(--muted)}
.erow .when b{display:block;color:var(--ink);font-weight:600}
.erow .when em{display:inline-block;font-style:normal;margin-top:4px;font-size:13.5px;background:var(--tint);color:var(--navy);border-radius:999px;padding:1px 10px}
.rows{list-style:none}
.rows li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2);font-size:16px}
.rows li:last-child{border-bottom:0}
.rows .pair{display:flex;align-items:center;gap:6px;flex:none}
.rows .pair i{font-style:normal;color:var(--paars);font-weight:700}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.box{background:var(--tint2);border-radius:var(--r);padding:20px 22px}
.box h3{margin-bottom:6px;font-size:19px}
.box .cnt{display:inline-block;font-size:14px;background:#fff;border-radius:999px;padding:1px 10px;color:var(--muted);margin-bottom:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;border:1px solid var(--line);border-radius:var(--r);padding:6px 22px}
.cols2 li:nth-last-child(2):nth-child(odd){border-bottom:0}
.empty{color:var(--muted);font-size:16px}

/* financien */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--tint2);border-radius:var(--r);padding:18px 20px;border-top:4px solid var(--navy)}
.stat:first-child{border-top-color:var(--paars)}
.stat span{display:block;font-size:15px;color:var(--muted)}
.stat b{display:block;font-size:32px;line-height:1.15;color:var(--navy);margin-top:4px}
.stat:first-child b{color:var(--paars)}
.stat small{font-size:14.5px;color:var(--muted)}
.stat dl{margin-top:6px;font-size:16px}
.stat dl div{display:flex;justify-content:space-between;gap:12px}
.stat dd{font-weight:700}
.fgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:20px}
.ychart{margin:0;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 16px}
.ybars{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;height:210px;border-bottom:1px solid #9aa6b2}
.ycol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.yb{display:block;width:min(52px,70%);background:var(--navy);border-radius:8px 8px 0 0}
.ycol:first-child .yb{background:var(--paars)}
.ycol:hover .yb{opacity:.85}
.yv{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap}
.yl{position:absolute;bottom:-26px;font-size:14.5px;color:var(--muted)}
.ychart figcaption{margin-top:34px;font-size:14.5px;color:var(--muted)}
.note{font-size:16px;color:var(--muted);background:var(--tint2);border-radius:var(--r);padding:20px 22px}
.note h3{font-size:18px;color:var(--ink);margin-bottom:4px}
.note .rows li{padding:8px 0}
.ftable{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.ftable table{width:100%;border-collapse:collapse;font-size:15px;min-width:1000px}
.ftable th{text-align:left;font-weight:600;padding:12px;background:var(--tint);white-space:nowrap;color:var(--navy)}
.ftable td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.ftable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ftable .b{font-weight:700}
.ftable td:first-child{white-space:nowrap}
.ftable td:first-child a:not(.code){margin-left:8px}
.ftable tr.zero td{color:#7a8592}
.ftable tr.has-note td{border-bottom:0}
.ftable tr.note-r td{padding-top:0;font-size:14.5px;color:var(--muted)}
.ftable tr.tot td{background:var(--tint2);border-bottom:0;font-weight:700;color:var(--navy)}

/* epicpagina */
.ehead{display:flex;gap:16px;align-items:center}
.ehead .code{font-size:20px;padding:4px 12px;border-radius:10px;background:var(--paars);color:#fff}
.egrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;margin-top:36px}
.egrid>div>section+section{margin-top:34px}
.egrid h2{font-size:24px;margin-bottom:8px}
.tl{list-style:none;margin-top:10px;display:grid;gap:12px}
.tl li{position:relative;padding:16px 20px 16px 54px;background:var(--tint2);border-radius:var(--r)}
.tl li::before{content:"";position:absolute;left:20px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--paars);box-shadow:0 0 0 4px var(--paars-t)}
.tl .when{display:inline-block;font-size:13.5px;font-weight:600;color:var(--paars);background:var(--paars-t);border-radius:999px;padding:0 10px}
.tl h3{font-size:18px;color:var(--ink);margin-top:4px}
.tl p{font-size:16px}
aside.info{align-self:start;display:grid;gap:14px}
aside.info section{background:var(--tint2);border-radius:var(--r);padding:20px 22px}
aside.info section.money{background:var(--navy);color:#fff}
aside.info section.money h2{color:#fff}
aside.info section.money .muted{color:#c9d6e4}
aside.info h2{font-size:19px;margin-bottom:6px}
aside.info p,aside.info li{font-size:16px}
aside.info p.amount{font-size:30px;font-weight:700;line-height:1.15}
aside.info .rows li{padding:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:#fff;border-radius:999px;padding:2px 12px;font-size:15px;color:var(--navy);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:48px}
.pager a{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:16px}
.pager a:hover{border-color:var(--paars);color:var(--paars)}

@media (max-width:1000px){.vblokken{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.visie-grid,.boxes,.fgrid{grid-template-columns:1fr}.egrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.cols2{grid-template-columns:1fr}.intro-card{margin:-40px 16px 0}}
@media (max-width:640px){.vcijfers{grid-template-columns:1fr}.vblok{padding-left:60px}body{font-size:16px}h1{font-size:30px}h2{font-size:23px}.logo span{width:190px;font-size:14px}.site-header .wrap{justify-content:flex-start;padding-left:24px}.menubar{position:static}.menubar a{padding:6px 12px;font-size:15.5px}.vtabs{border-radius:var(--r)}.erow{grid-template-columns:48px 1fr}.erow .when{grid-column:2;text-align:left}.rm{padding:6px 10px}.rm-grid{grid-template-columns:62px repeat(4,minmax(105px,1fr)) minmax(70px,.6fr);min-width:560px}.rm-label span:last-child{display:none}.rm-cols{grid-template-columns:repeat(4,minmax(105px,1fr)) minmax(70px,.6fr)}.rm-label{font-size:14px;gap:6px}.stats{grid-template-columns:1fr}.hero{border-radius:16px}.hero img{-webkit-mask-image:none;mask-image:none}.intro-card{margin:-24px 10px 0;padding:20px}.tile .go{width:34px;height:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tile:hover{transform:none}}
@media print{.menubar,.vtabs,.pager{display:none}}
</style>
</head>

const SCENE=9000;
const BG=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6fe"/><stop offset="1" stop-color="#e2f0fd"/></linearGradient>
  <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="${C.navy}"/></marker></defs>
  <rect width="960" height="540" fill="url(#sky)"/><path d="M0,330 Q480,280 960,330 V540 H0 Z" fill="${C.pale}"/>
  <path d="M120,360 Q420,330 520,380 Q640,440 900,400" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round" opacity=".7"/>`;

function mount(el,code){
  const film=FILMS[code]; if(!film) return;
  const total=film.length*SCENE;
  el.innerHTML=`<div class="film-stage"><svg viewBox="0 0 960 540" role="img" aria-label="Animatie ${code}: ${film.map(s=>s.k+'. '+s.t).join(' ')}" font-family="'Source Sans 3',Arial,sans-serif">${BG}<g class="scene"></g></svg>
    <div class="film-cap"><span class="film-k"></span><p></p></div>
    <button class="film-big" type="button" aria-label="Animatie afspelen"><span>▶</span></button></div>
    <div class="film-ctl"><button class="film-pp" type="button" aria-label="Afspelen">▶</button><div class="film-prog" aria-hidden="true">${film.map(()=>'<span><i></i></span>').join('')}</div>
    <span class="film-time">0:00 / 0:${String(Math.round(total/1000)).padStart(2,'0')}</span></div>`;
  const g=el.querySelector('.scene'),k=el.querySelector('.film-k'),p=el.querySelector('.film-cap p'),big=el.querySelector('.film-big'),pp=el.querySelector('.film-pp'),bars=[...el.querySelectorAll('.film-prog i')],time=el.querySelector('.film-time'),stage=el.querySelector('.film-stage');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t=0,cur=-1,playing=false,last=0,raf=0;
  function show(i){cur=i;g.innerHTML=film[i].svg();k.textContent=film[i].k;p.textContent=film[i].t;stage.classList.toggle('res',i===film.length-1)}
  function reveal(local){g.querySelectorAll('.an:not(.on)').forEach(n=>{if(reduce||+n.dataset.d<=local){n.classList.add('on');n.querySelectorAll('[data-count]').forEach(countUp)}})}
  function countUp(n){const [a,b]=n.dataset.count.split(',').map(Number);const st=performance.now();(function step(now){const f=Math.min(1,(now-st)/1600);n.textContent=Math.round(a+(b-a)*(1-Math.pow(1-f,3))).toLocaleString('nl-NL');if(f<1)requestAnimationFrame(step)})(st)}
  function ui(){const s=Math.floor(t/1000);time.textContent=`0:${String(s).padStart(2,'0')} / 0:${String(Math.round(total/1000)).padStart(2,'0')}`;bars.forEach((b,i)=>b.style.width=Math.max(0,Math.min(1,(t-i*SCENE)/SCENE))*100+'%');pp.textContent=playing?'❚❚':'▶';pp.setAttribute('aria-label',playing?'Pauzeren':'Afspelen');stage.classList.toggle('playing',playing)}
  function tick(now){if(!playing)return;if(!el.isConnected){playing=false;return}t+=Math.max(0,now-last);last=Math.max(last,now);if(t>=total){t=total;playing=false;ui();stage.classList.add('done');big.querySelector('span').textContent='↻';big.setAttribute('aria-label','Opnieuw afspelen');return}
    const i=Math.min(film.length-1,Math.max(0,Math.floor(t/SCENE)));if(i!==cur)show(i);reveal(t-i*SCENE);ui();raf=requestAnimationFrame(tick)}
  function play(){if(!el.isConnected)return;big.querySelector('span').textContent='▶';big.setAttribute('aria-label','Animatie afspelen');if(t>=total){t=0;cur=-1;stage.classList.remove('done')}if(cur===-1||stage.classList.contains('poster')){stage.classList.remove('poster');show(Math.floor(t/SCENE))}playing=true;last=performance.now();raf=requestAnimationFrame(tick);ui()}
  function pause(){playing=false;cancelAnimationFrame(raf);ui()}
  big.onclick=play;pp.onclick=()=>playing?pause():play();stage.onclick=e=>{if(e.target.closest('.film-big'))return;if(stage.classList.contains('poster')||stage.classList.contains('done'))play();else playing?pause():play()};
  el.querySelectorAll('.film-prog span').forEach((s,i)=>s.onclick=()=>{t=i*SCENE;stage.classList.remove('poster','done');show(i);if(!playing)reveal(0);ui()});
  show(0);reveal(SCENE);stage.classList.add('poster');ui();
}
window.EpicFilm={mount,has:c=>!!FILMS[c]};
})();

const refName=k=>EPICS[k]?EPICS[k].naam:'Productdomein '+T[k].titel;
const STRAT=['AI en Data','Modernisering IV','Efficiënte en wendbare uitvoering'];
const VIEWS=[['roadmap','Roadmap'],['afhankelijkheden','Afhankelijkheden'],['bijdrage',"Bijdrage aan strategische thema's"],['financien','Financiën']];
const YEARS=['2027','2028','2029','2030','2031'];
const eur=n=>'€ '+Math.round(n).toLocaleString('nl-NL');
const eurK=n=>n>=1e6?'€ '+(n/1e6).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2})+' mln':n>=1e3?'€ '+Math.round(n/1e3).toLocaleString('nl-NL')+'k':eur(n);
const fte=n=>n.toLocaleString('nl-NL',{maximumFractionDigits:1});
const finOf=k=>FIN.epics[k];
const sumY=(rows,y,f='tot')=>rows.reduce((a,r)=>a+r.jaren[y][f],0);
const actLabel=r=>!r.bron?'Geen aparte claim':r.act==='Overig'?'Overig, '+r.bron:r.act==='Vernieuwing'?'Vernieuwing':r.act==='Investering'?'Investering, leenfaciliteit':r.act+', '+r.bron;
let currentView='roadmap';

function setNav(active,parts){
  const items=[['home','Home','#/'],...THEMAS.map(t=>[t.id,t.titel,`#/thema/${t.id}/${currentView}`]),['beheer','Beheer','#/beheer']];
  menu.innerHTML=items.map(([id,l,h])=>`<li><a href="${h}"${id===active?' aria-current="page"':''}>${esc(l)}</a></li>`).join('');
  crumbs.innerHTML=parts.length>1?parts.map((p,i)=>i<parts.length-1?`<a href="${p[1]}">${esc(p[0])}</a><span class="sep">›</span>`:`<span>${esc(p[0])}</span>`).join(''):'';
}

function roadmap(ids){
  const head=`${[1,2,3,4].map(q=>`<div class="qh" style="grid-row:1;grid-column:${q+1}">Q${q} 2027</div>`).join('')}<div class="qh" style="grid-row:1;grid-column:6">2028 en verder</div>`;
  let rows='', r=2;
  ids.forEach(k=>{
    const e=EPICS[k],[a,b]=e.q,end=e.door?7:b+2;
    rows+=`<a class="rm-label" style="grid-row:${r}" href="#/epic/${k}"><span class="code">${k}</span><span>${esc(e.naam)}</span></a>`;
    rows+=`<a class="rm-bar${e.indicatief?' ind':''}${e.door?' door':''}" style="grid-row:${r};grid-column:${a+1}/${end}" href="#/epic/${k}" title="${esc(k+' '+e.naam+', '+qLabel(e)+(e.indicatief?' (indicatief)':''))}">${esc(qLabel(e))}</a>`;
    r++;
    if(e.mijlpalen.length){[1,2,3,4].forEach(q=>{const ms=e.mijlpalen.filter(m=>m[0]===q);if(ms.length)rows+=`<div class="rm-ms" style="grid-row:${r};grid-column:${q+1}">${ms.map(m=>`<i>${esc(m[1])}</i>`).join('')}</div>`});r++;}
  });
  const cols=`<div class="rm-cols" style="grid-row:1/${r}"><div></div><div></div><div></div><div></div><div></div></div>`;
  return `<div class="rm"><div class="rm-grid">${cols}${head}${rows}</div></div>
  <div class="legend"><span><i class="lg"></i>Planning uit de epiclijst</span><span><i class="lg ind"></i>Indicatief, afgeleid uit het jaarplan</span><span><i class="lg ms"></i>Mijlpaal</span></div>`;
}

function crossDeps(filter){
  const out=[];
  Object.entries(EPICS).forEach(([k,e])=>e.deps.forEach(([from,why])=>{const ft=EPICS[from]?EPICS[from].thema:from;if(ft!==e.thema&&filter(ft,e.thema))out.push({from,to:k,why})}));
  return out;
}
const depRow=d=>`<li><span class="pair">${refChip(d.from)}<i>→</i>${codeChip(d.to)}</span><span><b>${esc(refName(d.from))}</b> naar <b>${esc(EPICS[d.to].naam)}</b>. ${esc(d.why)}</span></li>`;
const depList=list=>list.length?`<ul class="rows">${list.map(depRow).join('')}</ul>`:'<p class="empty">Geen.</p>';

function yearChart(rows,label){
  const vals=YEARS.map(y=>sumY(rows,y)), max=Math.max(...vals,1);
  return `<figure class="ychart"><div class="ybars">${YEARS.map((y,i)=>`<div class="ycol" title="${y}: ${eur(vals[i])}"><span class="yv">${eurK(vals[i])}</span><span class="yb" style="height:${Math.max(2,Math.round(vals[i]/max*155))}px"></span><span class="yl">${y}</span></div>`).join('')}</div><figcaption>${esc(label)}</figcaption></figure>`;
}
function finTable(rows,keyLabel){
  const head=`<tr><th>${keyLabel}</th><th>Activiteit en bron</th><th class="n">FTE 2027</th><th class="n">Personeel 2027</th><th class="n">Inkoop (DUK) 2027</th><th class="n">Totaal 2027</th>${YEARS.slice(1).map(y=>`<th class="n">${y}</th>`).join('')}</tr>`;
  const body=rows.map(([cell,r,note])=>{const j=r.jaren['2027'],zero=!YEARS.some(y=>r.jaren[y].tot);
    return `<tr class="${zero?'zero ':''}${note?'has-note':''}"><td>${cell}</td><td>${esc(actLabel(r))}</td><td class="n">${j.fte?fte(j.fte):'-'}</td><td class="n">${j.pers?eur(j.pers):'-'}</td><td class="n">${j.duk?eur(j.duk):'-'}</td><td class="n b">${j.tot?eur(j.tot):'-'}</td>${YEARS.slice(1).map(y=>`<td class="n">${r.jaren[y].tot?eur(r.jaren[y].tot):'-'}</td>`).join('')}</tr>${note?`<tr class="note-r"><td></td><td colspan="9">${esc(note)}</td></tr>`:''}`}).join('');
  const rs=rows.map(x=>x[1]);
  const tot=`<tr class="tot"><td>Totaal</td><td></td><td class="n">${fte(sumY(rs,'2027','fte'))}</td><td class="n">${eur(sumY(rs,'2027','pers'))}</td><td class="n">${eur(sumY(rs,'2027','duk'))}</td><td class="n b">${eur(sumY(rs,'2027'))}</td>${YEARS.slice(1).map(y=>`<td class="n">${eur(sumY(rs,y))}</td>`).join('')}</tr>`;
  return `<div class="ftable"><table><thead>${head}</thead><tbody>${body}${tot}</tbody></table></div>`;
}
function stats(rows){
  const t27=sumY(rows,'2027'), multi=YEARS.reduce((a,y)=>a+sumY(rows,y),0);
  const acts={};rows.forEach(r=>{const v=r.jaren['2027'].tot;if(v){const k=r.act==='Overig'?'Overig (GID)':r.act;acts[k]=(acts[k]||0)+v}});
  return `<div class="stats"><div class="stat"><span>Begroot 2027</span><b>${eurK(t27)}</b><small>${eur(t27)}</small></div>
    <div class="stat"><span>FTE 2027</span><b>${fte(sumY(rows,'2027','fte'))}</b><small>in de begroting</small></div>
    <div class="stat"><span>2027 tot en met 2031</span><b>${eurK(multi)}</b><small>meerjarig totaal</small></div>
    <div class="stat"><span>2027 naar activiteit</span><dl>${Object.entries(acts).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${eurK(v)}</dd></div>`).join('')||'<div><dt>Geen</dt></div>'}</dl></div></div>`;
}

function overview(){
  setNav('home',[]);
  const tiles=THEMAS.map(t=>{const ks=epicsOf(t.id);return `<div class="tile"><span class="eyebrow">Productdomein</span><h2><a href="#/thema/${t.id}/roadmap">${esc(t.titel)}</a></h2><span class="go" aria-hidden="true">→</span>
    <p>${esc(t.pitch)}</p>
    <p class="facts"><span class="pill">${esc(t.eigenaar)}</span><span class="pill">${ks.length} epics</span><span class="pill p">${eurK(sumY(ks.map(finOf),'2027'))} in 2027</span></p></div>`}).join('');
  app.innerHTML=`
  <div class="hero"><img alt="" src="${HERO}"></div>
  <div class="intro-card"><span class="eyebrow">Deelportfolio IV voor Data en AI</span><h1>${esc(PORTFOLIO.titel)}</h1><p class="lead">Vier productdomeinen, 22 epics en één beheer-epic. Kies een domein voor roadmap, afhankelijkheden, strategische bijdrage en financiën.</p></div>
  <div class="tiles">${tiles}
    <div class="tile wide"><span class="eyebrow">Beheer-epic B1</span><h2><a href="#/beheer">${esc(PORTFOLIO.beheer.naam)}</a></h2><span class="go" aria-hidden="true">→</span><p>${esc(PORTFOLIO.beheer.tekst)}</p>
    <p class="facts"><span class="pill">${FIN.beheer.length} systemen en posten</span><span class="pill p">${eurK(sumY(FIN.beheer,'2027'))} in 2027</span></p></div></div>`;
}

function beheer(){
  setNav('beheer',[['Home','#/'],['Beheer en onderhoud','#/beheer']]);
  const groups={};FIN.beheer.forEach(r=>{(groups[r.project]=groups[r.project]||[]).push(r)});
  const rows=FIN.beheer.map(r=>[esc(r.systeem.replace('(Afschrijflasten uit P1)','(afschrijving P1)')),r,BEHEERTEKST[r.systeem]]);
  app.innerHTML=`<span class="eyebrow">Beheer-epic B1</span><h1>Beheer en onderhoud</h1><p class="lead">${esc(PORTFOLIO.beheer.tekst)}</p>
  <div class="meta"><div>Epic<b>B1</b></div><div>Systemen en posten<b>${FIN.beheer.length}</b></div><div>Financiering<b>GID, regulier beheer en onderhoud</b></div><div>Planning<b>Q1 t/m Q4 2027, doorlopend</b></div></div>
  <section class="section"><h2>Financiën</h2>${stats(FIN.beheer)}
    <div class="fgrid">${yearChart(FIN.beheer,'Begroot per jaar, beheer en onderhoud')}
    <div class="note"><h3>Per projectnaam in 2027</h3><ul class="rows">${Object.entries(groups).map(([g,rs])=>`<li><span style="flex:1">${esc(g)}</span><b>${eur(sumY(rs,'2027'))}</b></li>`).join('')}</ul></div></div></section>
  <section class="section"><h2>Per systeem</h2>${finTable(rows,'Systeem of post')}</section>`;
}

function theme(id,view){
  const t=T[id]; if(!t) return overview();
  if(!VIEWS.some(v=>v[0]===view)) view='roadmap';
  currentView=view;
  const vlabel=VIEWS.find(v=>v[0]===view)[1];
  setNav(id,[['Home','#/'],[t.titel,`#/thema/${id}/roadmap`],[vlabel,'']]);
  const ks=epicsOf(id);
  const vtabs=VIEWS.map(([v,l])=>`<a href="#/thema/${id}/${v}"${v===view?' aria-current="page"':''}>${esc(l)}</a>`).join('');
  let body='';
  if(view==='roadmap'){
    const goals=t.doelen.map((g,i)=>`<div class="goal"><h3>Doelstelling ${i+1}: ${esc(g.label)}</h3><p>${esc(g.toelichting)}</p>
      <ul class="elist">${g.epics.map(k=>{const e=EPICS[k],last=e.resultaten[e.resultaten.length-1];return `<li><a class="erow" href="#/epic/${k}"><span class="code">${k}</span>
        <div><h4>${esc(e.naam)}</h4><p>${esc(e.kort)}</p><p class="res">Resultaat ${esc(last.wanneer.replace(/^(Uiterlijk|Eind|Eerste)/,m=>m.toLowerCase()))}: ${esc(last.titel)}.</p></div>
        <span class="when"><b>${esc(qLabel(e))}</b>${e.indicatief?'<em>indicatief</em>':''}</span></a></li>`}).join('')}</ul></div>`).join('');
    body=`<section class="section"><h2>Roadmap 2027</h2>${roadmap(ks)}</section><section class="section"><h2>Doelstellingen en epics</h2>${goals}</section>`;
  } else if(view==='afhankelijkheden'){
    const inn=crossDeps((f,to)=>to===id), out=crossDeps((f,to)=>f===id);
    const intra=[];ks.forEach(k=>EPICS[k].deps.forEach(([f,why])=>{if(EPICS[f]&&EPICS[f].thema===id)intra.push({from:f,to:k,why})}));
    body=`<section class="section"><h2>Afhankelijkheden binnen IDAI</h2><p class="intro">De pijl loopt van het leverende naar het afhankelijke epic.</p>
      <div class="boxes"><div class="box"><h3>Leunt op andere domeinen</h3>${depList(inn)}</div><div class="box"><h3>Binnen dit domein</h3>${depList(intra)}</div><div class="box"><h3>Andere domeinen leunen hierop</h3>${depList(out)}</div></div></section>
      <section class="section"><h2>Externe afhankelijkheden</h2><p class="intro">Buiten het deelportfolio IDAI, per epic.</p>
      <ul class="rows cols2">${ks.map(k=>`<li>${codeChip(k)}<span><b>${esc(EPICS[k].naam)}.</b> ${esc(EPICS[k].extern)}</span></li>`).join('')}</ul></section>`;
  } else if(view==='financien'){
    const rows=ks.map(k=>[codeChip(k)+`<a href="#/epic/${k}">${esc(EPICS[k].naam)}</a>`,finOf(k),FINTEKST[k]]);
    body=`<section class="section"><h2>Financiën</h2>${stats(rows.map(r=>r[1]))}
      <div class="fgrid">${yearChart(rows.map(r=>r[1]),'Begroot per jaar, totaal van de epics in dit domein')}
      <div class="note"><h3>Zo lees je de cijfers</h3><p>Personeel is FTE maal 1.380 uur tegen € 111 per uur, met indexatie in latere jaren. Inkoop is DUK. Een epic zonder bedrag heeft geen aparte claim. Het valt binnen bestaande capaciteit of een ander budget; de toelichting staat in de tabel.</p></div></div></section>
      <section class="section"><h2>Per epic</h2>${finTable(rows,'Epic')}</section>`;
  } else {
    const cols=STRAT.map(s=>{const hit=ks.filter(k=>EPICS[k].themas.includes(s));
      return `<div class="box"><h3>${esc(s)}</h3><span class="cnt">${hit.length} van ${ks.length} epics</span>${hit.length?`<ul class="rows">${hit.map(k=>`<li>${codeChip(k)}<span><b>${esc(EPICS[k].naam)}.</b> ${esc(EPICS[k].kort)}${EPICS[k].iv?` <span class="muted">IV-roadmap ${esc(EPICS[k].iv)}.</span>`:''}</span></li>`).join('')}</ul>`:'<p class="empty">Geen bijdrage volgens de epiclijst.</p>'}</div>`}).join('');
    body=`<section class="section"><h2>Bijdrage aan de strategische thema's</h2><p class="intro">Volgens de epiclijst. Een epic kan aan meer dan één thema bijdragen.</p><div class="boxes">${cols}</div></section>`;
  }
  app.innerHTML=`<span class="eyebrow">Productdomein</span><h1>${esc(t.titel)}</h1><p class="lead">${esc(t.visie.doel)}</p>
  <div class="meta"><div>Eigenaar<b>${esc(t.eigenaar)}</b></div><div>Epics<b>${ks.length}</b></div><div>Doelstellingen<b>${t.doelen.length}</b></div><div>Horizon<b>${esc(t.horizon)}</b></div></div>
  <details class="visie"><summary>Lees de visie op dit productdomein</summary>${t.visie.blokken
    ?`<div class="vblokken in">${t.visie.blokken.map((x,i)=>`<div class="vblok"><span class="vnr">${i+1}</span><h3>${esc(x.titel)}</h3><p>${esc(x.tekst)}</p></div>`).join('')}</div>`
    :`<div class="visie-grid"><div><h3>Wat</h3><p>${esc(t.visie.wat)}</p></div><div><h3>Effect en waarde</h3><p>${esc(t.visie.waarde)}</p></div><div><h3>Uitgangspunten</h3><p>${esc(t.visie.rol)}</p></div></div>`}</details>
  <nav class="vtabs" aria-label="Onderdelen van ${esc(t.titel)}">${vtabs}</nav>
  ${body}`;
}

function epic(k){
  const e=EPICS[k]; if(!e) return overview();
  const t=T[e.thema], ks=epicsOf(e.thema), i=ks.indexOf(k);
  setNav(t.id,[['Home','#/'],[t.titel,`#/thema/${t.id}/roadmap`],[k+' '+e.naam,'']]);
  const users=[];Object.entries(EPICS).forEach(([kk,ee])=>ee.deps.forEach(([f,why])=>{if(f===k)users.push([kk,why])}));
  const f=finOf(k),j=f.jaren['2027'];
  const prev=ks[i-1],next=ks[i+1];
  app.innerHTML=`<span class="eyebrow">Epic in ${esc(t.titel)}</span><div class="ehead"><span class="code">${k}</span><h1>${esc(e.naam)}</h1></div><p class="lead">${esc(e.kort)}</p>
  <div class="meta"><div>Productdomein<b><a href="#/thema/${t.id}/roadmap">${esc(t.titel)}</a></b></div><div>Planning<b>${esc(qLabel(e))}${e.indicatief?' (indicatief)':''}</b></div><div>Type<b>${esc(e.type)}</b></div><div>Kenmerk<b>${esc(e.kenmerk)}</b></div><div>Portfoliofase<b>Trechter van initiatieven</b></div></div>
  <div class="egrid"><div>
    ${t.id==='ai'&&window.EpicFilm&&EpicFilm.has(k)?`<section class="film"><h2>In 30 seconden</h2><div id="film-box"></div></section>`:''}
    <section><h2>Beschrijving</h2><p>${esc(e.beschrijving)}</p>${e.vervolg?`<p class="muted" style="margin-top:8px">${esc(e.vervolg)}</p>`:''}</section>
    <section><h2>Wat leveren we op</h2><ul class="tl">${e.resultaten.map(r=>`<li><span class="when">${esc(r.wanneer)}</span><h3>${esc(r.titel)}</h3><p>${esc(r.tekst)}</p></li>`).join('')}</ul></section>
    <section><h2>Waarde</h2><p>${esc(e.waarde)}</p></section>
    <section><h2>Technische componenten</h2><p>${esc(e.componenten)}</p></section>
  </div><aside class="info">
    <section class="money"><h2>Financiën 2027</h2>${j.tot?`<p class="amount">${eur(j.tot)}</p><p class="muted">${esc(actLabel(f))}${j.fte?', '+fte(j.fte)+' FTE':''}</p>`:`<p><b>Geen aparte claim</b></p>`}<p style="margin-top:6px">${esc(FINTEKST[k]||'')}</p></section>
    <section><h2>Strategisch thema</h2><div class="tags">${e.themas.map(s=>`<span>${esc(s)}</span>`).join('')}</div>${e.iv?`<p class="muted" style="margin-top:8px">IV-roadmap ${esc(e.iv)}</p>`:''}</section>
    <section><h2>Afhankelijk van</h2>${e.deps.length?`<ul class="rows">${e.deps.map(([d,why])=>`<li>${refChip(d)}<span><b>${esc(refName(d))}.</b> ${esc(why)}</span></li>`).join('')}</ul>`:'<p class="empty">Geen epics binnen IDAI.</p>'}<p style="margin-top:8px"><b>Extern:</b> ${esc(e.extern)}</p></section>
    <section><h2>Andere epics leunen hierop</h2>${users.length?`<ul class="rows">${users.map(([u,why])=>`<li>${codeChip(u)}<span><b>${esc(EPICS[u].naam)}.</b> ${esc(why)}</span></li>`).join('')}</ul>`:'<p class="empty">Geen.</p>'}</section>
  </aside></div>
  <nav class="pager" aria-label="Andere epics in ${esc(t.titel)}">${prev?`<a href="#/epic/${prev}">‹ ${prev} ${esc(EPICS[prev].naam)}</a>`:'<span></span>'}${next?`<a href="#/epic/${next}">${next} ${esc(EPICS[next].naam)} ›</a>`:'<span></span>'}</nav>`;
  const fb=document.getElementById('film-box'); if(fb) EpicFilm.mount(fb,k);
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='thema') theme(h[1],h[2]); else if(h[0]==='beheer') beheer(); else if(h[0]==='epic') epic(decodeURIComponent(h[1]||'')); else overview();
  window.scrollTo(0,0); app.focus({preventScroll:true});
  const head=app.querySelector('h1'); document.title=(head?head.textContent+' | ':'')+'Jaarplan IDAI 2027';
}
window.addEventListener('hashchange',route); route();
})();
</script>
</body>
</html>
